storage:
  # Valid types are SQLITE or MYSQL.
  # It is not currently possible to automatically migrate from one to another.
  type: SQLITE

  # Only applicable if MYSQL storage type is selected
  mysql:
    host: "localhost"
    port: 3306
    username: "root"
    password: ""
    database: ""
    use_ssl: true

# Customize the discord webhook that is sent when a tournament has ended.
discord_webhook:
  # Should the webhook be enabled or not
  enable: false
  # The URL for the webhook.
  url: ''
  # Link to an avatar to use for the webhook.
  avatar_url: 'https://cdn.discordapp.com/attachments/1028362255785545747/1159605391274037298/XLT_logo.PNG?ex=6531a1ad&is=651f2cad&hm=c0beef7c23632a12fa461c12102e2878c17cb2d19ae46ba90e6d99f4ee7cce40&'
  # This is the message sent when the tournament ends.
  # Placeholders:
  #  {TOURNAMENT} - Returns the name of the tournament.
  #  {1_PLACE} - Returns the name of the first place winner.
  #  {2_PLACE} - Returns the name of the second place winner.
  #  {3_PLACE} - Returns the name of the first place winner.
  #
  #  {1_SCORE} - Returns the score of the first place winner.
  #  {2_SCORE} - Returns the score of the second place winner.
  #  {3_SCORE} - Returns the score of the third place winner.
  content: 'The {TOURNAMENT} has completed here are the winners!\n\n:first_place: 1st Place: {1_PLACE}\n:second_place: 2nd Place: {2_PLACE}\n:third_place: 3rd Place: {3_PLACE}'

# Command aliases to the main /tournament command
# ** You will need to restart your server if you edit this list **
command_aliases:
  - xlt
  - tournaments

# Should we hook into TokenEnchant explosive event for BLOCK_BREAK objective?
tokenenchant_explode_event: false

# Only applicable for PLACEHOLDERAPI objective type
# How many ticks until we fetch new data?
placeholderapi_objective_task_update: 60

# Only applicable for PLAYTIME objective type
# How many ticks until we fetch new playtime data?
playtime_objective_task_update: 200 # 10 seconds

# Anti-farm protection per objective. These are targeted cooldowns/rate-limits
# that block specific farming/spam patterns WITHOUT punishing normal play — a
# player standing still and clicking still earns score.
# Set a value to 0 to disable a specific check.
anti_farm:
  # Master switch. Setting this to false disables all anti-farm checks below.
  enabled: true
  # BLOCK_BREAK: how long the same block position is ignored after being broken.
  # Blocks farming the same regenerating block repeatedly (snow under a snow
  # golem, cobblestone generators, sugar cane loops).
  block_break_same_position_seconds: 10
  # BLOCK_PLACE: same as above, for placing blocks at the same position repeatedly.
  block_place_same_position_seconds: 10
  # PLAYTIME: how many seconds a player may remain fully idle (no movement or
  # camera rotation) before their playtime stops counting. Generous to avoid
  # false positives for players who stand still while interacting.
  playtime_afk_seconds: 300

# Anti-AFK protection. Suppresses score for players who keep FARMING an
# objective while being effectively AFK (auto-fishing, auto-eating, autocraft,
# kill-aura grinders, held-mouse-button loops). A score is refused only when the
# player is BOTH "calm" (no horizontal movement and no camera rotation for
# calm_window_seconds) AND the action looks automated (regular autoclicker
# intervals OR too many repeated actions while calm). Active players are never
# affected. This protects the objectives below; block break/place keep using the
# anti_farm cooldowns above.
anti_afk:
  # Master switch. false disables all anti-AFK checks below.
  enabled: true
  # A player is considered "calm" when they have neither changed block on the
  # X/Z plane nor rotated the camera for this many seconds. Vertical bobbing
  # while standing in water is ignored, so fishing in a pool while truly idle
  # still counts as calm.
  calm_window_seconds: 180
  # Minimum camera rotation (degrees) in a single move event to count as activity.
  # Kept low so even slow, genuine camera movement counts and never gets flagged.
  min_rotation_delta: 0.1
  # Minimum number of actions of the same type performed while calm before they
  # stop counting. Gives a grace period and avoids punishing occasional actions.
  min_actions_while_calm: 5
  # Autoclicker/regularity detection: how many recent actions of the same type
  # to remember, how many intervals are required before judging, and the maximum
  # coefficient of variation (stddev/mean) that is still considered "bot-like".
  # Lower regularity_max_cv = stricter. Set regularity_min_samples very high to
  # effectively disable the regularity check (only the "sustained" check is used).
  regularity_samples: 10
  regularity_min_samples: 6
  regularity_max_cv: 0.08
  # Per-objective toggles.
  objectives:
    PLAYER_FISH: true
    MOB_KILLS: true
    PLAYTIME: true
    ITEM_CRAFT: true
    POTION_BREW: true
    PLAYER_CONSUME: true